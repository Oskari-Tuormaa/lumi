manifest:
  version: "0.10"

  remotes:
    - name: zephyr
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyr
      repo-path: zephyr
      revision: v4.4.0
      import:
        - name-allowlist:
            # HAL: Espressif for ESP32S3
            - hal_espressif
            # ARM CMSIS for native_sim and ARM cores
            - cmsis
            - cmsis_6
            # GUI
            - lvgl
            # Bootloader
            - mcuboot
